    <script>
      // Antes del primer pintado: habilita las animaciones de entrada (.js) y
      // activa el modo ligero (.lite) en equipos modestos o con ahorro de datos.
      ;(function () {
        var root = document.documentElement
        var nav = navigator
        var conn = nav.connection
        root.classList.add('js')
        if (
          (nav.hardwareConcurrency && nav.hardwareConcurrency <= 4) ||
          (nav.deviceMemory && nav.deviceMemory <= 4) ||
          (conn && conn.saveData)
        ) {
          root.classList.add('lite')
        }
      })()
    </script>
